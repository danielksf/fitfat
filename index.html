<style>
:root{
 --bg:#07121b;--bg2:#0b1823;--card:#10212e;--card2:#132937;--text:#f4f8fb;--muted:#8ea3b2;
 --line:#203645;--green:#41e29c;--green2:#28c788;--blue:#4da3ff;--purple:#a66bff;--amber:#ffc764;--danger:#ff6b6b;
 --shadow:0 10px 28px rgba(0,0,0,.28);--radius:20px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
 --tap:48px;
}
[data-theme="light"]{--bg:#edf3f6;--bg2:#f6f9fb;--card:#ffffff;--card2:#f4f8fa;--text:#10212a;--muted:#657b88;--line:#d8e3e8;--shadow:0 8px 24px rgba(27,53,68,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;min-height:100%;overscroll-behavior:none}
body{padding-top:var(--safe-top);padding-bottom:calc(78px + var(--safe-bottom));}
button,input,select{font:inherit;color:inherit} button{cursor:pointer}
.app{max-width:540px;margin:0 auto;min-height:100vh;padding:14px 14px 30px}
.topbar{position:sticky;top:0;z-index:20;margin:-14px -14px 12px;padding:12px 14px 10px;background:linear-gradient(180deg,var(--bg) 75%,transparent);backdrop-filter:blur(18px)}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;object-fit:cover;box-shadow:var(--shadow)}
.brand h1{font-size:23px;margin:0;letter-spacing:-.5px}.small{font-size:12px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:var(--card);display:grid;place-items:center;color:var(--text)}
.week-pill{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.week-pill select{appearance:none;background:transparent;border:0;font-weight:800;outline:0;max-width:110px}
.hero{background:linear-gradient(145deg,#12324a,#0b1d2a 70%);border:1px solid #24485f;border-radius:24px;padding:18px;margin:8px 0 16px;box-shadow:var(--shadow)}
[data-theme="light"] .hero{background:linear-gradient(145deg,#e7f4fb,#fff)}
.hero-title{font-size:25px;font-weight:850;letter-spacing:-.7px}.hero-sub{color:var(--muted);margin-top:6px;line-height:1.35}.hero-actions{display:flex;gap:8px;margin-top:16px}
.btn{min-height:var(--tap);border:0;border-radius:15px;padding:0 16px;background:var(--card2);font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:var(--green);color:#062417}.btn.ghost{border:1px solid var(--line);background:transparent}.btn.danger{background:rgba(255,107,107,.13);color:var(--danger);border:1px solid rgba(255,107,107,.3)}.btn.full{width:100%}.btn.sm{min-height:38px;border-radius:12px;padding:0 12px;font-size:13px}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:19px 2px 9px}.section-title h2{font-size:18px;margin:0}.section-title span{font-size:12px;color:var(--muted)}
.workout-grid{display:grid;gap:10px}.workout-card{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:15px;text-align:left;box-shadow:var(--shadow);display:flex;align-items:center;gap:13px;min-height:88px}.workout-badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:23px;font-weight:900;background:color-mix(in srgb,var(--accent) 30%,var(--card2));color:var(--accent)}.workout-main{flex:1}.workout-name{font-weight:850;font-size:17px}.workout-sub{font-size:13px;color:var(--muted);margin-top:3px}.chev{font-size:24px;color:var(--muted)}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick-card{min-height:92px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:14px;text-align:left}.quick-card .qicon{font-size:24px}.quick-card b{display:block;margin-top:8px}.quick-card small{color:var(--muted)}
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(540px,100%);height:calc(68px + var(--safe-bottom));padding:7px 12px var(--safe-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(22px);border-top:1px solid var(--line);z-index:50}.navbtn{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.navbtn span:first-child{font-size:20px}.navbtn.active{color:var(--green)}
.view{display:none}.view.active{display:block;animation:fade .16s ease}@keyframes fade{from{opacity:.55;transform:translateY(4px)}to{opacity:1;transform:none}}
.pagehead{display:flex;align-items:center;gap:10px;margin:5px 0 10px}.pagehead h2{font-size:24px;margin:0;flex:1}.back{border:0;background:var(--card);border:1px solid var(--line);width:42px;height:42px;border-radius:14px;font-size:23px}
.progress-wrap{margin:10px 0 14px}.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:6px}.progressbar{height:8px;background:var(--card);border-radius:999px;overflow:hidden}.progressbar>div{height:100%;width:0;background:linear-gradient(90deg,var(--green),#6bf0b2);transition:width .2s}
.exercise-list{display:grid;gap:10px}.ex-card{border:1px solid var(--line);background:var(--card);border-radius:20px;overflow:hidden}.ex-summary{padding:14px}.ex-top{display:flex;gap:11px;align-items:flex-start}.ex-num{width:34px;height:34px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-weight:850;color:var(--muted);flex:0 0 auto}.ex-info{flex:1}.ex-name{font-size:16px;font-weight:850;line-height:1.2}.ex-prescription{font-size:13px;color:var(--green);font-weight:750;margin-top:5px}.ex-note{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.35}.badge{font-size:10px;font-weight:850;border-radius:999px;padding:5px 8px;border:1px solid var(--line);color:var(--muted)}.badge.optional{color:var(--amber);border-color:rgba(255,199,100,.35)}.badge.done{color:var(--green);border-color:rgba(65,226,156,.35)}
.ex-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.field{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:9px 11px}.field label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}.field input{width:100%;border:0;background:transparent;outline:0;font-size:17px;font-weight:800;padding:0}.last{font-size:11px;color:var(--muted);margin-top:8px}.series-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.series-chip{width:42px;height:42px;border:1px solid var(--line);background:var(--card2);border-radius:12px;font-weight:850}.series-chip.checked{background:var(--green);color:#062417;border-color:var(--green)}.ex-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.ex-actions .btn{min-height:42px;font-size:13px}
.inactive-section{margin-top:16px}.inactive-toggle{width:100%;border:1px dashed var(--line);background:transparent;color:var(--muted);min-height:48px;border-radius:15px;font-weight:750}.inactive-list{display:none;margin-top:8px}.inactive-list.show{display:grid;gap:8px}.inactive-item{padding:12px;border:1px solid var(--line);background:var(--card);border-radius:15px}.inactive-item b{display:block}.inactive-item small{color:var(--muted)}
.session-bar{position:sticky;bottom:77px;z-index:15;background:linear-gradient(0deg,var(--bg) 78%,transparent);padding:10px 0 5px}.session-bar .btn{box-shadow:0 8px 30px rgba(65,226,156,.18)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(5px);z-index:100;display:none;align-items:flex-end;justify-content:center}.modal-backdrop.show{display:flex}.sheet{width:min(540px,100%);max-height:88vh;background:var(--bg2);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:14px 14px calc(18px + var(--safe-bottom));overflow:auto;box-shadow:0 -20px 70px rgba(0,0,0,.45)}.sheet-handle{width:42px;height:5px;background:var(--line);border-radius:99px;margin:0 auto 12px}.sheet-head{display:flex;align-items:center;gap:10px}.sheet-head h3{margin:0;font-size:22px;flex:1}.close{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);font-size:18px}.tabs{display:flex;gap:5px;background:var(--card);border-radius:14px;padding:4px;margin:14px 0}.tab{flex:1;min-height:38px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:750;font-size:12px}.tab.active{background:var(--card2);color:var(--text)}
.detail-block{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;margin:10px 0}.detail-block h4{margin:0 0 9px;font-size:15px}.detail-block ul,.detail-block ol{padding-left:20px;margin:0;color:var(--muted);font-size:13px;line-height:1.5}.muscles{display:flex;flex-wrap:wrap;gap:7px}.muscle{padding:7px 9px;border-radius:999px;background:var(--card2);font-size:12px}.visual-placeholder{min-height:180px;border-radius:18px;background:linear-gradient(145deg,#132d3d,#0b1a24);border:1px solid #244559;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#8fafbf;margin-bottom:10px}.visual-placeholder .vpicon{font-size:48px;display:block;margin-bottom:8px}.steps-carousel{display:flex;overflow:auto;gap:9px;scroll-snap-type:x mandatory;padding-bottom:4px}.step-card{min-width:82%;scroll-snap-align:start;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px}.step-no{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--green);color:#062417;font-weight:900;margin-bottom:10px}.step-card p{font-size:13px;color:var(--muted);line-height:1.45;margin:0}.week-grid{display:grid;gap:6px}.week-row{display:grid;grid-template-columns:70px 1fr;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.week-row:last-child{border-bottom:0}.week-row b{font-size:12px}.week-row span{font-size:12px;color:var(--muted)}
.alt-list{display:grid;gap:8px}.alt-item{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:12px;display:flex;align-items:center;gap:10px}.alt-item input{width:20px;height:20px}.alt-item label{flex:1;font-weight:750}.checkbox-line{display:flex;gap:9px;align-items:center;margin:14px 2px}.checkbox-line input{width:20px;height:20px}
.timer-sheet{align-items:center}.timer-box{text-align:center;padding:18px 0}.timer-ring{width:220px;height:220px;border-radius:50%;margin:8px auto 18px;display:grid;place-items:center;background:conic-gradient(var(--green) var(--timer-angle,360deg),var(--card2) 0);position:relative}.timer-ring:after{content:'';position:absolute;inset:10px;background:var(--bg2);border-radius:50%}.timer-text{position:relative;z-index:1;font-size:46px;font-weight:900;letter-spacing:-1px}.timer-presets{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.timer-presets .btn.active{background:var(--green);color:#062417}
.cardio-list,.history-list,.settings-list{display:grid;gap:9px}.info-card{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px}.info-card h3{font-size:16px;margin:0 0 4px}.info-card p{font-size:12px;color:var(--muted);margin:0;line-height:1.4}.info-card .current{color:var(--green);font-weight:850;font-size:14px;margin-top:9px}.cardio-log{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.cardio-log input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:12px;outline:0}
.history-item{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:13px}.history-top{display:flex;justify-content:space-between;gap:8px}.history-top b{font-size:15px}.history-top span{font-size:11px;color:var(--muted)}.history-stats{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:7px}
.chart-card{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;margin-top:10px}.chart-controls select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:12px;outline:0}.chart{height:170px;margin-top:12px}.chart svg{width:100%;height:100%;overflow:visible}.chart .axis{stroke:var(--line);stroke-width:1}.chart .line{fill:none;stroke:var(--green);stroke-width:3}.chart .dot{fill:var(--green)}.chart .label{fill:var(--muted);font-size:10px}
.setting-row{border:1px solid var(--line);background:var(--card);border-radius:17px;padding:13px;display:flex;align-items:center;gap:10px}.setting-row>div{flex:1}.setting-row b{display:block;font-size:14px}.setting-row small{color:var(--muted)}.setting-row select{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:9px;outline:0}.switch{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;border:0}.switch:after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:white;left:3px;top:3px;transition:.2s}.switch.on{background:var(--green)}.switch.on:after{left:23px}
.summary{text-align:center;padding:16px 0}.summary .bigcheck{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:rgba(65,226,156,.14);border:2px solid var(--green);font-size:40px;color:var(--green);margin:10px auto}.summary h2{font-size:27px;margin:8px 0}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.stat{border:1px solid var(--line);background:var(--card);border-radius:17px;padding:13px}.stat b{font-size:21px;display:block}.stat small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:#152c39;border:1px solid #294858;color:#fff;border-radius:14px;padding:11px 14px;z-index:200;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 28px);font-size:13px;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--muted);padding:30px 12px}.muted{color:var(--muted)}.divider{height:1px;background:var(--line);margin:12px 0}.hidden{display:none!important}

const LS_KEY='fitfat_v01_state';
const defaults={week:1,timer:90,theme:'dark',history:[],activeSession:null,permanentSwaps:{},cardioHistory:[],wakeLock:false};
let state=loadState();
let currentView='home';
let currentWorkout=null;
let timerInterval=null,timerRemaining=0,timerTotal=0;
let wakeLockSentinel=null;

function loadState(){try{return {...defaults,...JSON.parse(localStorage.getItem(LS_KEY)||'{}')}}catch(e){return {...defaults}}}
function saveState(){localStorage.setItem(LS_KEY,JSON.stringify(state))}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function cleanPrescription(s){
  if(!s)return '';
  return s.replace(/\s*\|\s*RPE[^|;]*/gi,'').replace(/RPE\s*[≤<>]?\s*\d+(?:[–-]\d+)?/gi,'').replace(/\s{2,}/g,' ').trim().replace(/\|\s*$/,'').trim();
}
function isInactive(p){const s=(p||'').trim().toLowerCase();return s==='—'||s.startsWith('continuar fora')||s.startsWith('reavaliar')}
function isOptional(p){return /opcional|teste curto|se .*tolerad|se .*estável|se .*assintom/i.test(p||'')}
function parseSets(p){const m=(p||'').match(/(?:(\d+)\s*[–-]\s*)?(\d+)\s*×/); if(!m)return 0; return Number(m[2])||0}
function parseRepsDefault(p){
  const s=(p||'').replace(/\s/g,'');
  let m=s.match(/×(\d+)(?:[–-](\d+))?/);if(m)return Number(m[2]||m[1]);
  m=s.match(/(\d+)[–-](\d+)min/);if(m)return '';
  return '';
}
function exerciseById(id){for(const w of Object.values(DATA.workouts)){const e=w.exercises.find(x=>x.id===id);if(e)return e}return null}

function fmtDate(ts){try{return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'}).format(new Date(ts))}catch(e){return ''}}
function fmtDuration(ms){const min=Math.max(0,Math.round(ms/60000));if(min<60)return `${min} min`;return `${Math.floor(min/60)}h ${String(min%60).padStart(2,'0')}min`}

function shouldSuggestAdvance(){if(state.week>=6)return false;const types=new Set(state.history.filter(h=>h.week===state.week).slice(-12).map(h=>h.workoutKey));return ['A','B','C'].every(x=>types.has(x))}
function advanceWeek(){if(state.week<6){state.week++;saveState();renderCurrent();toast(`Agora na Semana ${state.week}`)}}

function renderWorkoutsHub(){
 const root=document.getElementById('view-workouts');
 root.innerHTML=`<div class="pagehead"><h2>Treinos</h2></div><div class="workout-grid">${Object.entries(DATA.workouts).map(([k,w])=>`<button class="workout-card" style="--accent:${w.accent}" onclick="nav('workout',{workout:'${k}'})"><div class="workout-badge">${k}</div><div class="workout-main"><div class="workout-name">${esc(w.title)}</div><div class="workout-sub">${esc(w.subtitle)} · Semana ${state.week}</div></div><div class="chev">›</div></button>`).join('')}</div><div class="section-title"><h2>Cardio</h2></div><button class="workout-card" style="--accent:#41e29c" onclick="nav('cardio')"><div class="workout-badge">🚲</div><div class="workout-main"><div class="workout-name">Cardio</div><div class="workout-sub">Plano de retorno e registro</div></div><div class="chev">›</div></button>`;
}

function ensureSession(wkey){
 if(state.activeSession && state.activeSession.workoutKey===wkey)return state.activeSession;
 return null;
}
function startWorkout(wkey){
 if(state.activeSession && state.activeSession.workoutKey!==wkey){if(!confirm('Há outro treino em andamento. Encerrar o anterior e iniciar este?'))return;state.activeSession=null}
 const entries={};
 DATA.workouts[wkey].exercises.forEach(ex=>{const p=weekPrescription(ex);if(!isInactive(p)){const last=lastEntry(ex.id);entries[ex.id]={load:last?.entry?.load||'',reps:parseRepsDefault(p)||last?.entry?.reps||'',setsDone:0,targetSets:parseSets(p),tempSwap:null}}});
 state.activeSession={workoutKey:wkey,week:state.week,startedAt:Date.now(),entries};saveState();requestWakeLock();renderWorkout(wkey);toast('Treino iniciado')
}
function renderWorkout(wkey){
 if(!wkey){nav('workouts');return}currentWorkout=wkey;const w=DATA.workouts[wkey];const root=document.getElementById('view-workout');const ses=ensureSession(wkey);
 const active=w.exercises.filter(e=>!isInactive(weekPrescription(e)));const inactive=w.exercises.filter(e=>isInactive(weekPrescription(e)));
 const doneCount=ses?active.filter(e=>(ses.entries[e.id]?.setsDone||0)>=(ses.entries[e.id]?.targetSets||parseSets(weekPrescription(e))||1)).length:0;
 const denom=active.filter(e=>!isOptional(weekPrescription(e))).length||active.length; const pct=Math.min(100,Math.round(doneCount/Math.max(1,denom)*100));
 const cards=active.map((ex,i)=>exerciseCard(ex,i,ses)).join('');
 root.innerHTML=`<div class="pagehead"><button class="back" onclick="nav('workouts')">‹</button><div style="flex:1"><h2 style="margin:0">${esc(w.title)}</h2><div class="small">${esc(w.subtitle)} · Semana ${state.week}</div></div></div>
 <div class="progress-wrap"><div class="progress-meta"><span>${ses?`${doneCount} concluídos`:'Plano da semana'}</span><span>${ses?pct+'%':active.length+' itens'}</span></div><div class="progressbar"><div style="width:${ses?pct:0}%"></div></div></div>
 ${!ses?`<div class="info-card"><h3>Semana ${state.week}</h3><p>As prescrições abaixo vêm do seu plano atual. Durante o treino, a carga da última sessão aparecerá automaticamente quando existir.</p></div>`:''}
 <div class="exercise-list">${cards}</div>
 ${inactive.length?`<div class="inactive-section"><button class="inactive-toggle" onclick="toggleInactive()">Ver exercícios fora desta semana (${inactive.length})</button><div class="inactive-list" id="inactiveList">${inactive.map(ex=>`<div class="inactive-item" onclick="openDetails('${ex.id}')"><b>${esc(ex.name)}</b><small>${esc(cleanPrescription(weekPrescription(ex)))||'Fora desta semana'} · ${esc(ex.note)}</small></div>`).join('')}</div></div>`:''}
 <div class="session-bar">${ses?`<button class="btn primary full" onclick="finishWorkout()">Concluir treino</button>`:`<button class="btn primary full" onclick="startWorkout('${wkey}')">▶ Iniciar treino</button>`}</div>`;
}
function toggleInactive(){document.getElementById('inactiveList')?.classList.toggle('show')}
function exerciseCard(ex,i,ses){
 const p=weekPrescription(ex);const optional=isOptional(p);const entry=ses?.entries?.[ex.id];const sets=entry?.targetSets||parseSets(p)||0;const swap=entry?.tempSwap||state.permanentSwaps[ex.id];const name=swap||ex.name;const last=lastEntry(ex.id);
 const chips=ses&&sets?Array.from({length:sets},(_,n)=>`<button class="series-chip ${(entry.setsDone||0)>n?'checked':''}" onclick="toggleSet('${ex.id}',${n+1})">${(entry.setsDone||0)>n?'✓':n+1}</button>`).join(''):'';
 return `<article class="ex-card"><div class="ex-summary"><div class="ex-top"><div class="ex-num">${i+1}</div><div class="ex-info"><div class="ex-name">${esc(name)}${swap?` <span class="badge">troca</span>`:''}</div><div class="ex-prescription">${esc(cleanPrescription(p))}</div><div class="ex-note">${esc(ex.note)}</div></div>${optional?'<span class="badge optional">Opcional</span>':''}</div>
 ${ses?`<div class="ex-form"><div class="field"><label>Carga</label><input inputmode="decimal" placeholder="kg" value="${esc(entry.load)}" oninput="updateEntry('${ex.id}','load',this.value)"></div><div class="field"><label>Repetições</label><input inputmode="numeric" placeholder="reps" value="${esc(entry.reps)}" oninput="updateEntry('${ex.id}','reps',this.value)"></div></div>${last?`<div class="last">Última sessão: ${esc(last.entry.load||'—')} kg × ${esc(last.entry.reps||'—')} reps · ${fmtDate(last.date)}</div>`:'<div class="last">Primeiro registro deste exercício</div>'}<div class="series-row">${chips}</div>`:''}
 <div class="ex-actions"><button class="btn ghost" onclick="openDetails('${ex.id}')">Detalhes</button><button class="btn ghost" onclick="openSwap('${ex.id}')">Trocar exercício</button></div></div></article>`
}
function updateEntry(id,key,val){if(!state.activeSession)return;state.activeSession.entries[id][key]=val;saveState()}
function toggleSet(id,n){const s=state.activeSession;if(!s)return;const e=s.entries[id];if(n<=e.setsDone)e.setsDone=n-1;else if(n===e.setsDone+1)e.setsDone=n;else e.setsDone=n;saveState();renderWorkout(s.workoutKey);if(n<=e.setsDone)startTimer(state.timer)}
async function requestWakeLock(){if(!state.wakeLock)return;try{if('wakeLock'in navigator)wakeLockSentinel=await navigator.wakeLock.request('screen')}catch(e){}}

 const steps=t.steps.map((x,i)=>`<div class="step-card"><div class="step-no">${i+1}</div><p>${esc(x)}</p></div>`).join('');
 document.getElementById('detailContent').innerHTML=`<div class="sheet-head"><h3>${esc(ex.name)}</h3><button class="close" onclick="closeModal('detailModal')">×</button></div><div class="tabs"><button class="tab active">Execução</button><button class="tab" onclick="scrollDetail('musclesBlock')">Músculos</button><button class="tab" onclick="scrollDetail('tipsBlock')">Dicas</button><button class="tab" onclick="scrollDetail('errorsBlock')">Erros</button></div>
 <div class="visual-placeholder"><div><span class="vpicon">🏋️</span><b>Biblioteca visual</b><br><small>As imagens específicas deste exercício serão adicionadas na próxima versão visual do FitFat. A sequência abaixo já funciona como guia de execução.</small></div></div>
 <div class="steps-carousel">${steps}</div>

 <div class="detail-block"><h4>Progressão planejada</h4><div class="week-grid">${ex.weeks.map((x,i)=>`<div class="week-row"><b>Semana ${i+1}</b><span>${esc(cleanPrescription(x))}</span></div>`).join('')}</div></div>`;
 document.getElementById('detailModal').classList.add('show')
}

function openSwap(id){const ex=exerciseById(id);if(!ex)return;const current=state.activeSession?.entries?.[id]?.tempSwap||state.permanentSwaps[id]||'';const alts=ex.tech.alts||[];
 document.getElementById('swapContent').innerHTML=`<div class="sheet-head"><h3>Trocar ${esc(ex.name)}</h3><button class="close" onclick="closeModal('swapModal')">×</button></div><p class="muted" style="font-size:13px;line-height:1.45">Escolha uma alternativa para esta sessão. Marque a opção permanente se quiser que ela apareça no lugar do exercício original daqui em diante.</p><div class="alt-list">${alts.length?alts.map((a,i)=>`<div class="alt-item"><input type="radio" name="alt" id="alt${i}" value="${esc(a)}" ${a===current?'checked':''}><label for="alt${i}">${esc(a)}</label></div>`).join(''):'<div class="empty">Nenhuma alternativa cadastrada ainda.</div>'}</div>${current?`<button class="btn ghost full" style="margin-top:10px" onclick="clearSwap('${id}')">Voltar ao exercício original</button>`:''}<label class="checkbox-line"><input type="checkbox" id="permanentSwap"><span>Trocar permanentemente</span></label><button class="btn primary full" onclick="confirmSwap('${id}')">Confirmar troca</button>`;
 document.getElementById('swapModal').classList.add('show')

function confirmSwap(id){const selected=document.querySelector('input[name="alt"]:checked');if(!selected){toast('Escolha uma alternativa');return}const val=selected.value;const perm=document.getElementById('permanentSwap').checked;if(perm)state.permanentSwaps[id]=val;if(state.activeSession?.entries?.[id])state.activeSession.entries[id].tempSwap=val;saveState();closeModal('swapModal');renderCurrent();toast(perm?'Troca permanente salva':'Troca aplicada nesta sessão')}

function startTimer(seconds){timerTotal=seconds;timerRemaining=seconds;renderTimer();document.getElementById('timerModal').classList.add('show');clearInterval(timerInterval);timerInterval=setInterval(()=>{timerRemaining--;renderTimer();if(timerRemaining<=0){clearInterval(timerInterval);beep();setTimeout(()=>closeModal('timerModal'),900)}},1000)}
function renderTimer(){const m=Math.floor(Math.max(0,timerRemaining)/60),s=Math.max(0,timerRemaining)%60;const angle=timerTotal?Math.round(timerRemaining/timerTotal*360):0;document.getElementById('timerContent').innerHTML=`<div class="sheet-head"><h3>Descanso</h3><button class="close" onclick="stopTimer()">×</button></div><div class="timer-box"><div class="timer-ring" style="--timer-angle:${angle}deg"><div class="timer-text">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div></div><div class="timer-presets">${[30,60,90,120,180].map(x=>`<button class="btn sm ${state.timer===x?'active':''}" onclick="changeTimer(${x})">${x<60?x+'s':x%60?x/60+'min':x/60+'min'}</button>`).join('')}</div><div style="display:flex;gap:8px;margin-top:18px"><button class="btn ghost full" onclick="timerRemaining+=30;timerTotal+=30;renderTimer()">+30s</button><button class="btn primary full" onclick="stopTimer()">Pular</button></div></div>`}
function changeTimer(x){state.timer=x;saveState();timerTotal=x;timerRemaining=x;renderTimer()}

function beep(){try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.value=.06;o.start();o.stop(ctx.currentTime+.16)}catch(e){}}

function finishWorkout(){const s=state.activeSession;if(!s)return;const w=DATA.workouts[s.workoutKey];const exs=w.exercises.filter(ex=>s.entries[ex.id]).map(ex=>{const e=s.entries[ex.id];return {id:ex.id,originalId:ex.id,name:e.tempSwap||state.permanentSwaps[ex.id]||ex.name,load:e.load,reps:e.reps,setsDone:e.setsDone,targetSets:e.targetSets,prescription:cleanPrescription(weekPrescription(ex,s.week))}});const rec={date:Date.now(),workoutKey:s.workoutKey,week:s.week,startedAt:s.startedAt,durationMs:Date.now()-s.startedAt,exercises:exs};state.history.push(rec);state.activeSession=null;saveState();if(wakeLockSentinel){try{wakeLockSentinel.release()}catch(e){}}renderSummary(rec)}
function renderSummary(rec){currentView='summary';document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-summary').classList.add('active');const sets=rec.exercises.reduce((a,e)=>a+(e.setsDone||0),0);const done=rec.exercises.filter(e=>e.setsDone>0).length;document.getElementById('view-summary').innerHTML=`<div class="summary"><div class="bigcheck">✓</div><h2>Treino concluído</h2><p class="muted">${esc(DATA.workouts[rec.workoutKey].title)} · Semana ${rec.week}</p><div class="summary-grid"><div class="stat"><b>${fmtDuration(rec.durationMs)}</b><small>Duração</small></div><div class="stat"><b>${sets}</b><small>Séries</small></div><div class="stat"><b>${done}</b><small>Exercícios registrados</small></div><div class="stat"><b>${fmtDate(rec.date)}</b><small>Data</small></div></div><button class="btn primary full" onclick="nav('home')">Voltar ao início</button><button class="btn ghost full" style="margin-top:9px" onclick="nav('history')">Ver histórico</button></div>`}

function renderCardio(){const root=document.getElementById('view-cardio');root.innerHTML=`<div class="pagehead"><button class="back" onclick="nav('home')">‹</button><h2>Cardio</h2></div><div class="info-card" style="margin-bottom:10px"><h3>Semana ${state.week}</h3><p>A bicicleta reclinada continua sendo a modalidade principal do plano. Use a resposta do pé no dia seguinte como referência para progredir.</p></div><div class="cardio-list">${DATA.cardio.map(c=>`<div class="info-card"><h3>${esc(c.name)}</h3><p>${esc(c.note)}</p><div class="current">${esc(cleanPrescription(c.weeks[state.week-1]))}</div>${c.id==='bike_recumbent'?`<div class="cardio-log"><input id="cardioMinutes" inputmode="numeric" placeholder="minutos"><input id="cardioNote" placeholder="observação"></div><button class="btn primary full" style="margin-top:8px" onclick="logCardio('${c.id}')">Registrar cardio</button>`:''}</div>`).join('')}</div>`}

function allExerciseOptions(){return Object.values(DATA.workouts).flatMap(w=>w.exercises).map(e=>({id:e.id,name:e.name}))}
function renderHistory(){const root=document.getElementById('view-history');const history=[...state.history].reverse();const opts=allExerciseOptions();root.innerHTML=`<div class="pagehead"><h2>Histórico</h2></div><div class="chart-card"><div class="chart-controls"><select id="chartExercise" onchange="renderChart(this.value)"><option value="">Evolução de carga por exercício</option>${opts.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></div><div class="chart" id="chart"><div class="empty">Escolha um exercício para ver a evolução.</div></div></div><div class="section-title"><h2>Seus treinos</h2><span>${state.history.length}</span></div><div class="history-list">${history.length?history.map(h=>{const sets=h.exercises.reduce((a,e)=>a+(e.setsDone||0),0);return `<div class="history-item"><div class="history-top"><b>${esc(DATA.workouts[h.workoutKey]?.title||h.workoutKey)}</b><span>${fmtDate(h.date)} · Semana ${h.week}</span></div><div class="history-stats"><span>${fmtDuration(h.durationMs)}</span><span>${sets} séries</span><span>${h.exercises.filter(e=>e.setsDone>0).length} exercícios</span></div></div>`}).join(''):'<div class="empty">Seu primeiro treino registrado aparecerá aqui.</div>'}</div>`}
function renderChart(id){const rows=[];for(const h of state.history){const e=h.exercises.find(x=>x.originalId===id||x.id===id);const val=parseFloat(String(e?.load||'').replace(',','.'));if(e&&Number.isFinite(val))rows.push({x:h.date,y:val})}const el=document.getElementById('chart');if(rows.length<1){el.innerHTML='<div class="empty">Ainda não há cargas registradas para este exercício.</div>';return}const W=320,H=150,p=24;const min=Math.min(...rows.map(r=>r.y)),max=Math.max(...rows.map(r=>r.y));const spread=Math.max(1,max-min);const pts=rows.map((r,i)=>({x:p+(W-2*p)*(rows.length===1?.5:i/(rows.length-1)),y:H-p-(H-2*p)*((r.y-min)/spread),...r}));const path=pts.map((q,i)=>(i?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1)).join(' ');el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line class="axis" x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}"/><path class="line" d="${path}"/>${pts.map((q,i)=>`<circle class="dot" cx="${q.x}" cy="${q.y}" r="4"/><text class="label" x="${q.x}" y="${q.y-9}" text-anchor="middle">${q.y===undefined?'':rows[i].y}</text>`).join('')}</svg>`}

function renderSettings(){const root=document.getElementById('view-settings');const swaps=Object.entries(state.permanentSwaps);root.innerHTML=`<div class="pagehead"><h2>Mais</h2></div><div class="settings-list"><div class="setting-row"><div><b>Semana atual</b><small>Você pode mudar a qualquer momento</small></div><select onchange="state.week=Number(this.value);saveState();renderCurrent()">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${n===state.week?'selected':''}>${n}</option>`).join('')}</select></div><div class="setting-row"><div><b>Tempo de descanso</b><small>Usado ao marcar uma série</small></div><select onchange="state.timer=Number(this.value);saveState()">${[30,60,90,120,180].map(x=>`<option value="${x}" ${x===state.timer?'selected':''}>${x<60?x+' s':x/60+' min'}</option>`).join('')}</select></div><div class="setting-row"><div><b>Tema</b><small>Interface do FitFat</small></div><select onchange="state.theme=this.value;saveState();applyTheme()"><option value="dark" ${state.theme==='dark'?'selected':''}>Escuro</option><option value="light" ${state.theme==='light'?'selected':''}>Claro</option></select></div><div class="setting-row"><div><b>Manter tela acordada</b><small>Tenta evitar que a tela apague durante o treino</small></div><button class="switch ${state.wakeLock?'on':''}" onclick="state.wakeLock=!state.wakeLock;saveState();renderSettings()"></button></div></div>
 <div class="section-title"><h2>Substituições permanentes</h2></div>${swaps.length?`<div class="settings-list">${swaps.map(([id,name])=>`<div class="setting-row"><div><b>${esc(exerciseById(id)?.name||id)}</b><small>→ ${esc(name)}</small></div><button class="btn sm ghost" onclick="clearSwap('${id}')">Remover</button></div>`).join('')}</div>`:'<div class="info-card"><p>Nenhuma troca permanente cadastrada.</p></div>'}
 <div class="section-title"><h2>Dados</h2></div><div class="settings-list"><button class="btn ghost full" onclick="exportData()">Exportar backup</button><button class="btn ghost full" onclick="document.getElementById('importFile').click()">Importar backup</button><input class="hidden" type="file" id="importFile" accept="application/json" onchange="importData(this.files[0])"><button class="btn danger full" onclick="clearAllData()">Apagar dados locais</button></div><div class="info-card" style="margin-top:12px"><p>FitFat v${DATA.version} · Dados ficam neste navegador. Esta versão é mobile-first e funciona sem login.</p></div>`}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fitfat-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{state={...defaults,...JSON.parse(r.result)};saveState();renderCurrent();toast('Backup importado')}catch(e){alert('Arquivo inválido')}};r.readAsText(file)}
function clearAllData(){if(confirm('Apagar todos os treinos, cargas e configurações do FitFat neste aparelho?')){localStorage.removeItem(LS_KEY);state={...defaults};nav('home');toast('Dados apagados')}}

setupWeek();applyTheme();renderHome();
</script>
</body></html>
